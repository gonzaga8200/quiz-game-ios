name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: macos-26
    timeout-minutes: 75
    env:
      IOS_VERSION: latest
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      # The exact version that generated the committed project (Homebrew's can lag or lead, and
      # each version writes the project slightly differently).
      - name: Install XcodeGen
        run: |
          version=$(cat .xcodegen-version)
          curl -sSfL "https://github.com/yonaskolb/XcodeGen/releases/download/$version/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generated project is up to date
        run: scripts/generate.sh && git diff --exit-code -- Contrarreloj.xcodeproj App/Resources/Info.plist

      - name: Core tests (parity with the web)
        run: scripts/test-core.sh

      - name: App unit tests
        run: scripts/test-app.sh

      - name: UI tests (iPhone)
        run: scripts/test-ui.sh iphone
