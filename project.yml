# XcodeGen spec for Contrarreloj. Edit this file, then run scripts/generate.sh.
# The generated Contrarreloj.xcodeproj is committed so the project opens without XcodeGen.
name: Contrarreloj

options:
  bundleIdPrefix: com.contrarrelojquiz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ContrarrelojCore:
    path: Packages/ContrarrelojCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0

targets:
  Contrarreloj:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.entitlements"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Contrarreloj
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIAppFonts:
          - PlayfairDisplay-Bold.ttf
          - PlayfairDisplay-ExtraBold.ttf
          - PlayfairDisplay-BoldItalic.ttf
          - PlayfairDisplay-ExtraBoldItalic.ttf
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
          - AtkinsonHyperlegibleNext-Italic.ttf
          - AtkinsonHyperlegibleNext-BoldItalic.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: Nogal
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        # Analytics stays off until the player accepts (see AnalyticsService). No IDFA, no IDFV,
        # advertising signals denied forever.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contrarrelojquiz.app
        PRODUCT_NAME: Contrarreloj
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: $(ENTITLEMENTS_FILE_$(ENABLE_APPLE_SIGN_IN))
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: ContrarrelojCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
    postBuildScripts:
      - name: Copy Firebase configuration if present
        basedOnDependencyAnalysis: false
        script: |
          # The real GoogleService-Info.plist is git-ignored. Without it the app runs arcade-only.
          SRC="${SRCROOT}/Config/GoogleService-Info.plist"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then cp "$SRC" "$DST"; else rm -f "$DST"; fi

  ContrarrelojTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # Parity fixtures generated from the web (Tools/parity), shared with the core package.
      - path: Packages/ContrarrelojCore/Tests/ContrarrelojCoreTests/Fixtures/app-utils.json
        buildPhase: resources
    dependencies:
      - target: Contrarreloj
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.contrarrelojquiz.app.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  ContrarrelojUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Contrarreloj
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.contrarrelojquiz.app.uitests
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  ContrarrelojIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
    dependencies:
      - target: Contrarreloj
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.contrarrelojquiz.app.integrationtests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  Contrarreloj:
    build:
      targets:
        Contrarreloj: all
    run:
      config: Debug
    test:
      config: Debug
      # Unit tests run inside the app: keep it off any real Firebase project.
      commandLineArguments:
        "-noFirebase": true
      targets:
        - ContrarrelojTests
        - ContrarrelojUITests
    archive:
      config: Release
  ContrarrelojIntegrationTests:
    build:
      targets:
        Contrarreloj: all
        ContrarrelojIntegrationTests: [test]
    test:
      config: Debug
      commandLineArguments:
        "-noFirebase": true
      targets:
        - ContrarrelojIntegrationTests
